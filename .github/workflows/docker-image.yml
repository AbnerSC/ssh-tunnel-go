# =====================================================================
# GitHub Actions：代码校验 + Docker 多架构镜像构建并推送到 Docker Hub
# （linux/amd64 + linux/arm64）
#
# 与 .gitea/workflows/docker-image.yml 分工：
#   - 本文件只会被 GitHub 读取，推送到 Docker Hub 官方仓库
#   - Gitea 侧工作流只会被 Gitea Actions 读取，推送到自建 Nexus
#
# 触发方式：
#   - 提交 PR 时仅执行代码校验（gofmt / vet / test），不推送镜像
#   - 推送 release-v 开头的 tag（如 release-v1.2.3）自动构建，
#     推送 版本号（1.2.3）+ latest 标签
#   - 支持在 Actions 页面手动触发：选择 release-v 开头的 tag 时
#     同样推送 版本号 + latest 标签；选择分支时仅推送 latest
#
# 推送目标：
#   - Docker Hub（需在仓库 Settings -> Secrets 中配置：
#       DOCKERHUB_USERNAME  Docker Hub 用户名
#       DOCKERHUB_TOKEN     Docker Hub 访问令牌（Account Settings -> Security -> New Access Token））
# =====================================================================
name: Docker 多架构镜像构建

on:
  push:
    tags:
      - 'release-v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ssh-tunnel
  IMAGE_USERNAME: babyfly

jobs:
  verify:
    name: 代码校验与测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 格式检查
        shell: bash
        run: |
          # gofmt -l 列出未格式化文件，非空即失败（避免格式漂移被合入）
          UNFORMATTED="$(gofmt -l .)"
          if [[ -n "$UNFORMATTED" ]]; then
            echo "::error::以下文件未通过 gofmt："
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: 静态检查
        run: go vet ./...

      - name: 单元与集成测试
        run: go test ./... -race -count=1

  build-and-push:
    name: 构建并推送多架构镜像到 Docker Hub
    needs: verify
    # PR 来自 fork 时拿不到 Secrets，跳过推送，仅由 verify 提供门禁
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 从 tag 解析版本号：release-v1.2.3 -> 1.2.3
      # 无论 tag 推送还是手动选择 tag 触发，只要 ref 以 release-v 开头即解析；
      # 手动选择分支触发时无版本号，仅推 latest
      - name: 解析版本号
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == release-v* ]]; then
            TAG="${GITHUB_REF_NAME#release-v}"
            if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag 格式必须为 release-vX.Y.Z，实际为：${GITHUB_REF_NAME}"
              exit 1
            fi
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
            echo "解析出版本号：$TAG"
          fi

      # 构建信息通过 -ldflags 注入二进制，供 -version 与启动日志使用
      - name: 生成构建信息
        id: buildinfo
        shell: bash
        run: |
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      # arm64 跨架构构建需要 QEMU 模拟（运行阶段 FROM 目标架构基础镜像并执行 apt-get）
      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # release-v 开头的 tag（推送或手动选择）：1.2.3、latest；手动选择分支：仅 latest
      - name: 生成镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_USERNAME }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}
            type=raw,value=latest

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version != '' && steps.version.outputs.version || 'latest' }}
            COMMIT=${{ steps.buildinfo.outputs.commit }}
            BUILD_DATE=${{ steps.buildinfo.outputs.date }}
          # 关闭 provenance 证明，避免部分客户端拉取时出现 unknown digest
          provenance: false
          # 使用 GitHub Actions 缓存加速 Go 模块层复用
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出推送结果
        shell: bash
        run: |
          echo "已推送镜像："
          echo "${{ steps.meta.outputs.tags }}"
